<!DOCTYPE html>
<html lang="he" dir="rtl" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>סבתא שרה זאָגט - פתגמים ביידיש</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;600;700;900&family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'yiddish-red': '#721c24',
                        'yiddish-gold': '#d4af37',
                        'yiddish-accent': '#b8860b',
                        'yiddish-cream': '#fdfbf7',
                        'yiddish-dark': '#2c1810',
                        'yiddish-emerald': '#1e5631',
                        'parchment': '#fbf7ed',
                        'parchment-dark': '#f2ead8'
                    },
                    fontFamily: {
                        'yiddish': ['"Frank Ruhl Libre"', 'serif'],
                        'sans': ['Assistant', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        html, body {
            height: 100%;
            max-height: 100dvh;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        /* 3D Card Flip Animation */
        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
        }
        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }

        /* Syllable Karaoke Highlight */
        .word-highlight {
            background-color: #FEE2E2;
            color: #8B263E;
            border-radius: 0.25rem;
            padding: 0 0.25rem;
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.5);
            transition: all 0.1s ease-in-out;
            transform: scale(1.05);
            display: inline-block;
        }

        /* Custom Scrollbar for inner elements */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #C5A059;
            border-radius: 4px;
        }

        /* Vintage Texture Background Pattern */
        .bg-pattern {
            background-color: #fdfbf7;
            background-image: radial-gradient(#d4af37 0.5px, transparent 0.5px), radial-gradient(#d4af37 0.5px, #fdfbf7 0.5px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            background-opacity: 0.15;
        }

        /* Glassmorphism details */
        .glass-panel {
            background: rgba(255, 253, 247, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(212, 175, 55, 0.3);
        }
    </style>
</head>
<body class="flex flex-col text-yiddish-dark bg-pattern select-none">

    <!-- Top App Navigation -->
    <header class="w-full bg-yiddish-red text-yiddish-cream shadow-md px-4 py-2.5 flex justify-between items-center z-20 shrink-0 border-b-2 border-yiddish-gold">
        <div class="flex items-center space-x-2 space-x-reverse">
            <div onclick="handleAvatarClick()" title="לחץ להצגת תמונת סבתא שרה" class="w-11 h-11 rounded-full bg-yiddish-gold p-0.5 flex items-center justify-center shadow-md cursor-pointer hover:scale-105 transition shrink-0 overflow-hidden border border-yiddish-cream/50 relative group">
                <img id="headerSaraImg" src="https://i.postimg.cc/34FQynJq/Sara_Book_Front.jpg" onerror="handleDefaultPhotoError(this)" alt="סבתא שרה" style="object-position: 47% 37%; transform: scale(1.95);" class="w-full h-full object-cover rounded-full">
                <span id="headerSaraFallback" style="display:none;" class="w-full h-full flex items-center justify-center text-yiddish-dark font-bold text-xl">👵🏻</span>
                <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 flex items-center justify-center transition">
                    <i class="fa-solid fa-magnifying-glass-plus text-white text-xs"></i>
                </div>
            </div>
            <input type="file" id="saraPhotoInput" accept="image/*" class="hidden" onchange="handlePhotoUpload(event)">
            <div>
                <h1 class="font-yiddish font-bold text-lg md:text-xl leading-tight text-white tracking-wide">סבתא שרה זאָגט</h1>
                <p class="text-xs text-yiddish-gold font-medium leading-none">פתגמים ביידיש על החיים, האוכל ומה שביניהם.</p>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <button id="quizBtn" onclick="toggleQuizMode()" class="px-2.5 py-1 bg-yiddish-gold/20 hover:bg-yiddish-gold/30 border border-yiddish-gold text-yiddish-cream text-xs rounded-full transition flex items-center gap-1.5 shadow-sm">
                <i class="fa-solid fa-graduation-cap text-yiddish-gold"></i>
                <span id="quizBtnText" class="hidden sm:inline">מצב בוחן</span>
            </button>

            <button onclick="openScoreboardModal()" class="px-2.5 py-1 bg-yiddish-emerald text-white text-xs rounded-full hover:bg-opacity-90 transition flex items-center gap-1 shadow-sm">
                <i class="fa-solid fa-trophy text-yiddish-gold"></i>
                <span id="scoreDisplay">0</span>
            </button>

            <button onclick="openRulesModal()" class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 text-yiddish-cream flex items-center justify-center text-sm transition">
                <i class="fa-solid fa-circle-info"></i>
            </button>
        </div>
    </header>

    <!-- Sub-bar Filter Categories & Controls -->
    <div class="w-full bg-parchment-dark border-b border-yiddish-accent/30 px-3 py-2 flex items-center justify-between z-10 shrink-0 shadow-inner">
        <!-- Category Filters -->
        <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5 text-xs" id="categoryContainer">
            <button onclick="filterCategory('הכל')" data-cat="הכל" class="category-btn active border px-3 py-1 rounded-full font-semibold bg-yiddish-red text-white border-yiddish-red shadow-sm transition whitespace-nowrap">הכל</button>
            <button onclick="filterCategory('מועדפים')" data-cat="מועדפים" class="category-btn border px-3 py-1 rounded-full font-semibold bg-white text-yiddish-dark border-yiddish-accent/40 hover:bg-yiddish-cream transition whitespace-nowrap flex items-center gap-1"><i class="fa-solid fa-bookmark text-yiddish-gold"></i> <span>מועדפים</span> <span id="favTabCount" class="text-[10px] bg-yiddish-gold/20 px-1.5 rounded-full">0</span></button>
            <button onclick="filterCategory('החיים')" data-cat="החיים" class="category-btn border px-3 py-1 rounded-full font-semibold bg-white text-yiddish-dark border-yiddish-accent/40 hover:bg-yiddish-cream transition whitespace-nowrap">החיים</button>
            <button onclick="filterCategory('האוכל')" data-cat="האוכל" class="category-btn border px-3 py-1 rounded-full font-semibold bg-white text-yiddish-dark border-yiddish-accent/40 hover:bg-yiddish-cream transition whitespace-nowrap">האוכל</button>
            <button onclick="filterCategory('משפחה')" data-cat="משפחה" class="category-btn border px-3 py-1 rounded-full font-semibold bg-white text-yiddish-dark border-yiddish-accent/40 hover:bg-yiddish-cream transition whitespace-nowrap">משפחה</button>
            <button onclick="filterCategory('חוכמה')" data-cat="חוכמה" class="category-btn border px-3 py-1 rounded-full font-semibold bg-white text-yiddish-dark border-yiddish-accent/40 hover:bg-yiddish-cream transition whitespace-nowrap">חוכמה</button>
            <button onclick="filterCategory('קללות וברכות')" data-cat="קללות וברכות" class="category-btn border px-3 py-1 rounded-full font-semibold bg-white text-yiddish-dark border-yiddish-accent/40 hover:bg-yiddish-cream transition whitespace-nowrap">🌶️ קללות וברכות</button>
            <button onclick="filterCategory('נמחקו')" data-cat="נמחקו" class="category-btn border px-3 py-1 rounded-full font-semibold bg-white text-rose-800 border-rose-300 hover:bg-rose-50 transition whitespace-nowrap flex items-center gap-1"><i class="fa-solid fa-trash-can text-rose-600"></i> <span>נמחקו</span> <span id="deletedTabCount" class="text-[10px] bg-rose-100 text-rose-800 px-1.5 rounded-full">0</span></button>
        </div>

        <button onclick="shuffleCards()" title="ערבב קלפים" class="mr-2 w-7 h-7 rounded-full bg-white border border-yiddish-accent/40 text-yiddish-dark hover:bg-yiddish-gold hover:text-white flex items-center justify-center text-xs shadow-sm transition shrink-0">
            <i class="fa-solid fa-shuffle"></i>
        </button>
    </div>

    <!-- Main Card Display Arena (100dvh Mobile & Desktop Fit) -->
    <main class="flex-1 min-h-0 relative flex flex-col items-center justify-between p-2.5 sm:p-3 overflow-hidden max-w-md mx-auto w-full">
        
        <!-- Flash Message Overlay -->
        <div id="toastMessage" class="hidden absolute top-3 z-50 bg-yiddish-dark text-yiddish-cream px-4 py-2 rounded-full text-xs shadow-lg transition-all transform duration-300 border border-yiddish-gold flex items-center gap-2">
            <i class="fa-solid fa-circle-check text-yiddish-gold"></i>
            <span id="toastText">הודעה</span>
        </div>

        <!-- Card Container with 3D Flip -->
        <div class="w-full flex-1 min-h-0 max-h-[680px] perspective-1000 my-auto flex flex-col justify-center">
            <div id="cardInner" class="w-full h-full min-h-0 transform-style-3d relative rounded-2xl shadow-xl border-2 border-yiddish-gold/50 cursor-pointer" onclick="flipCard()">
                
                <!-- Front Side of Card: ONLY Yiddish Proverb + Pronunciation (Guessing Phase!) -->
                <div class="absolute inset-0 w-full h-full overflow-hidden bg-parchment rounded-2xl p-3.5 sm:p-5 flex flex-col justify-between backface-hidden border-4 border-double border-yiddish-accent/40 shadow-inner">
                    <!-- Top Card Info Header -->
                    <div class="flex justify-between items-center text-xs text-yiddish-dark/60 font-medium shrink-0">
                        <span id="cardCategoryBadge" class="bg-yiddish-gold/20 text-yiddish-dark border border-yiddish-gold/40 px-2.5 py-0.5 rounded-full font-semibold">
                            החיים
                        </span>
                        <span id="cardCounter" class="font-mono font-bold">1 / 45</span>
                        <button onclick="toggleBookmark(event)" id="bookmarkBtn" title="שמור במועדפים" class="w-7 h-7 sm:w-8 sm:h-8 rounded-full flex items-center justify-center text-base sm:text-lg text-gray-300 hover:text-yiddish-gold transition">
                            <i class="fa-solid fa-bookmark"></i>
                        </button>
                    </div>

                    <!-- Card Body / Yiddish Text Only (So the table can guess!) -->
                    <div class="my-auto text-center py-1 flex flex-col items-center justify-center min-h-0 overflow-y-auto">
                        <span class="text-[11px] uppercase tracking-wider text-yiddish-accent/80 font-bold mb-1.5 sm:mb-2 bg-yiddish-gold/10 px-3 py-0.5 rounded-full shrink-0">
                            קראו בקול ונחשו מה הפירוש:
                        </span>

                        <!-- Yiddish Text with Karaoke Highlighting -->
                        <div id="yiddishText" class="font-yiddish font-bold text-2xl sm:text-3xl md:text-4xl text-yiddish-red leading-snug sm:leading-relaxed mb-2.5 sm:mb-4 transition-colors duration-200 px-1">
                            אַז מע
